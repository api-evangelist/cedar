aid: cedar
name: Cedar
description: >-
  Cedar is a healthcare financial technology company whose patient financial
  experience platform unifies billing, payments, insurance coverage, and
  support for health systems, hospitals, and clinician-services groups. Its
  products include Cedar Pay (pre-visit, post-visit, and financing patient
  payments), Cedar Cover (benefits and financial assistance, including Medicaid
  enrollment), Cedar Support (AI-powered patient support and call-center
  automation via Kora AI), and Cedar Intelligence (a proprietary AI system for
  personalized patient engagement). Cedar reports having served over 50 million
  patients and processed billions of dollars in patient payments. The company
  is backed by a16z, Founders Fund, QED Investors, and SV Angel. Cedar publishes
  no public developer API, developer portal, SDKs, or GitHub organization; this
  profile captures its public identity, legal, and security-posture surface.
